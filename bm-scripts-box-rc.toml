[bmscriptsbox]

[bmscriptsbox.info]
id = "e8a3c1d0-6b4f-4a7e-9c2d-5f1e8b3a7d0c"
name = "不忙OCR"
desc = "离线OCR文字识别脚本 | 基于RapidOCR(PP-OCRv6)+PP-DocLayoutV3版面分析+RapidTable表格重建+PP-FormulaNet_plus-M公式识别,支持图片批量识别、标题/段落/表格/图片/公式结构还原、并行处理、检测框可视化,导出Markdown/Word/TXT/JSON/Excel,支持定时任务与节点联动,模型由不忙脚本盒子统一下载"
version = "2.7.0"
icon = "./imgs/ocr.png"

[bmscriptsbox.runtime]
language = "python"
language_version = ">=3.10"
entry = "main.py"
terminal = "always"

[bmscriptsbox.triggers.context_menu]
enabled = true
targets = ["files"]
filters = [".png", ".jpg", ".jpeg", ".bmp", ".tiff", ".webp"]

[[bmscriptsbox.inputs]]
name = "target_paths"
label = "源文件"
type = "list"
pick = "files"
exts = [".png", ".jpg", ".jpeg", ".bmp", ".tiff", ".webp"]
description = "要识别的图片文件"

[[bmscriptsbox.params]]
name = "layout_analysis"
label = "版面分析"
type = "bool"
default = true
description = "启用 RapidLayout 版面分析（还原标题/表格/图片结构）；关闭则仅纯文本排版，不加载模型"

[[bmscriptsbox.params]]
name = "layout_conf_thresh"
label = "版面阈值"
type = "float"
default = 0.3
when = { field = "layout_analysis", eq = true }
description = "版面区域检测置信度阈值 (0.1-0.9)"

[[bmscriptsbox.params]]
name = "box_thresh"
label = "检测阈值"
type = "float"
default = 0.5
description = "OCR 文本检测置信度阈值 (0.1-0.9)"

[[bmscriptsbox.params]]
name = "preprocess_mode"
label = "预处理"
type = "str"
default = "无"
choices = ["无", "自动", "灰度化", "二值化", "降噪", "增强对比度"]
description = "OCR 前对图片的预处理方式；自动=按对比度自适应增强"

[[bmscriptsbox.params]]
name = "export_format"
label = "导出格式"
type = "str"
default = "Markdown"
choices = ["Markdown", "Word", "TXT", "JSON", "Excel"]
description = "识别结果的导出格式（Word 中的公式为可编辑的 Word 原生公式）"

[[bmscriptsbox.params]]
name = "show_boxes"
label = "检测框可视化"
type = "bool"
default = true
description = "是否保存带文字检测框的标注图"

[[bmscriptsbox.params]]
name = "formula_ocr"
label = "公式识别"
type = "bool"
default = false
description = "将版面检出的公式区域识别为 LaTeX（按需开启，单条约 1-2 秒）"

# ====== AI 模型（盒子安装时统一下载，脚本通过 /api/model/path 取路径） ======
[[bmscriptsbox.models]]
source = "modelscope"
repo_id = "RapidAI/RapidLayout"
files = ["onnx/pp_doc_layout/pp_doc_layoutv3.onnx"]

[[bmscriptsbox.models]]
source = "modelscope"
repo_id = "RapidAI/RapidDoc"
files = ["formula/PP-FormulaNet_plus-M/pp_formulanet_plus_m.onnx"]

[bmscriptsbox.params_form]
enabled = true

[bmscriptsbox.schedule]
enabled = true

[bmscriptsbox.node]
enabled = true

[[bmscriptsbox.outputs]]
name = "results"
type = "list"
description = "各图片导出的结果文件路径列表"

[[bmscriptsbox.outputs]]
name = "text"
type = "str"
description = "合并后的 Markdown 识别文本"

[[bmscriptsbox.outputs]]
name = "ocr_data"
type = "list"
description = "逐图 OCR 结构化结果: [{image, items:[{text, score, box, points}], tables:[{bbox, cells}]}]"